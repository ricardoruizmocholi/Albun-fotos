  <text x="400" y="470" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.82)">Imagen de muestra</text>
  <text x="400" y="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.48)">Sube tus fotos para verlas aquí</text>
