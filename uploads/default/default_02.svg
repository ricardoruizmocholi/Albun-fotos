<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7971e"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <!-- sun glow -->
  <circle cx="400" cy="260" r="140" fill="url(#sun)"/>
  <!-- sun rays -->
  <g transform="translate(400,260)" stroke="rgba(255,255,255,0.35)" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="-90" x2="0" y2="-120"/>
    <line x1="63" y1="-63" x2="84" y2="-84"/>
    <line x1="90" y1="0" x2="120" y2="0"/>
    <line x1="63" y1="63" x2="84" y2="84"/>
    <line x1="0" y1="90" x2="0" y2="120"/>
    <line x1="-63" y1="63" x2="-84" y2="84"/>
    <line x1="-90" y1="0" x2="-120" y2="0"/>
    <line x1="-63" y1="-63" x2="-84" y2="-84"/>
  </g>
  <circle cx="400" cy="260" r="58" fill="rgba(255,255,255,0.3)"/>
  <!-- horizon -->
  <rect x="0" y="430" width="800" height="170" fill="rgba(0,0,0,0.12)"/>
  <text x="400" y="490" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.88)">Imagen de muestra</text>
  <text x="400" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.52)">Sube tus fotos para verlas aquí</text>
</svg>
